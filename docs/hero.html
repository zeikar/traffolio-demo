<!doctype html>
<!-- Source of docs/hero-light.png and docs/hero-dark.png, the README's hero image: screenshot the
     #panel element at a 1200x380 viewport with a transparent background, once as hero.html and once
     as hero.html?theme=dark. Tokens are copied from src/dashboard/styles.ts. The chart data is illustrative. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --surface: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #59636e;
    --views: #0969da; --grid: #eaeef2; --axis: #8c959f; --selected: #ddf4ff;
  }
  :root.dark {
    --surface: #151b23; --border: #3d444d; --text: #f0f6fc; --muted: #9198a1;
    --views: #4493f8; --grid: #262c36; --axis: #656c76; --selected: rgba(56,139,253,.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 380px; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #panel {
    position: absolute; inset: 2px;
    background: var(--surface); border: 2px solid var(--border); border-radius: 16px;
  }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div id="panel"><svg id="chart" width="1192" height="372" viewBox="0 0 1192 372"></svg></div>
<script>
  if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.classList.add("dark");

  // Same illustrative series as docs/social-preview.html.
  const N = 112, WINDOW = 14;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const vals = [];
  for (let i = 0; i < N; i++) {
    const week = [0.72, 1, 0.98, 0.95, 0.9, 0.62, 0.55][i % 7];
    let v = week * (0.45 + 0.5 * (i / N)) * (0.75 + 0.5 * rnd());
    if (i === 38) v *= 1.35; if (i === 39) v *= 1.15;
    if (i === 84) v *= 1.7; if (i === 85) v *= 1.3;
    vals.push(v);
  }
  const W = 1192, padL = 36, padR = 36, topY = 92, base = 296;
  const max = Math.max(...vals) * 1.05;
  const x = (i) => padL + (i * (W - padL - padR)) / (N - 1);
  const y = (v) => base - (v / max) * (base - topY);
  const ns = "http://www.w3.org/2000/svg", svg = document.getElementById("chart");
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    svg.appendChild(e);
    return e;
  };

  const wx = (x(N - WINDOW - 1) + x(N - WINDOW)) / 2;
  el("rect", { x: wx, y: topY - 30, width: x(N - 1) + 12 - wx, height: base - topY + 30, fill: "var(--selected)", rx: 6 });
  el("text", { x: x(N - 1) + 6, y: topY - 42, "text-anchor": "end", "font-size": 24, "font-weight": 600, fill: "var(--views)" }, "What GitHub shows: 14 days");
  el("text", { x: padL, y: 52, "font-size": 22, "font-weight": 600, fill: "var(--text)" }, "Daily views");

  for (const f of [0.25, 0.5, 0.75]) {
    const gy = base - f * (base - topY);
    el("line", { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: "var(--grid)", "stroke-width": 1.5 });
  }
  el("line", { x1: padL, x2: W - padR, y1: base + 0.5, y2: base + 0.5, stroke: "var(--axis)", "stroke-width": 1.5 });

  const d = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  el("path", { d, fill: "none", stroke: "var(--views)", "stroke-width": 3.5, "stroke-linejoin": "round", "stroke-linecap": "round" });

  el("text", { x: padL, y: base + 44, "font-size": 24, fill: "var(--muted)" }, "What Traffolio keeps: every day since you started");
</script>
</body>
</html>
