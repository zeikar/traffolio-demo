<!doctype html>
<!-- Source of docs/social-preview.png, the repository's social preview: screenshot this page at a 1280x640 viewport. The chart data is illustrative. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Tokens copied from src/dashboard/styles.ts so the card looks like the product. */
  :root {
    --bg: #f6f8fa; --surface: #ffffff; --border: #d0d7de;
    --text: #1f2328; --muted: #59636e; --views: #0969da;
    --grid: #eaeef2; --axis: #8c959f; --selected: #ddf4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden; position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    position: absolute; left: 72px; top: 58px;
    font-size: 84px; line-height: 1; font-weight: 650; letter-spacing: -0.025em;
  }
  .lede {
    position: absolute; left: 74px; top: 162px;
    font-size: 30px; line-height: 1.3; color: var(--muted); white-space: nowrap;
  }
  .panel {
    position: absolute; left: 72px; right: 72px; top: 236px; height: 300px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  }
  .foot {
    position: absolute; left: 74px; right: 72px; bottom: 44px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 22px; color: var(--muted);
  }
  .foot strong { color: var(--text); font-weight: 600; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<h1>Traffolio</h1>
<p class="lede">Your GitHub traffic history, kept in your own repository.</p>
<div class="panel"><svg id="chart" width="1134" height="298" viewBox="0 0 1134 298"></svg></div>
<div class="foot"><strong>No server. No database. Just GitHub.</strong><span>github.com/zeikar/traffolio</span></div>
<script>
  // Deterministic daily views: weekday rhythm, slow growth, two release spikes.
  const N = 112, WINDOW = 14;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const vals = [];
  for (let i = 0; i < N; i++) {
    const week = [0.72, 1, 0.98, 0.95, 0.9, 0.62, 0.55][i % 7];
    let v = week * (0.45 + 0.5 * (i / N)) * (0.75 + 0.5 * rnd());
    if (i === 38) v *= 1.35; if (i === 39) v *= 1.15;
    if (i === 84) v *= 1.7; if (i === 85) v *= 1.3;
    vals.push(v);
  }
  const W = 1134, padL = 28, padR = 28, topY = 64, base = 238;
  const max = Math.max(...vals) * 1.05;
  const x = (i) => padL + (i * (W - padL - padR)) / (N - 1);
  const y = (v) => base - (v / max) * (base - topY);
  const ns = "http://www.w3.org/2000/svg", svg = document.getElementById("chart");
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    svg.appendChild(e);
    return e;
  };

  // The 14 days GitHub still returns, as a highlighted band (the dashboard's "selected" tint).
  const wx = (x(N - WINDOW - 1) + x(N - WINDOW)) / 2;
  el("rect", { x: wx, y: topY - 26, width: x(N - 1) + 10 - wx, height: base - topY + 26, fill: "var(--selected)", rx: 4 });
  el("text", { x: x(N - 1) + 4, y: topY - 34, "text-anchor": "end", "font-size": 18, "font-weight": 600, fill: "var(--views)" }, "What GitHub shows: 14 days");

  for (const f of [0.25, 0.5, 0.75]) {
    const gy = base - f * (base - topY);
    el("line", { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: "var(--grid)", "stroke-width": 1 });
  }
  el("line", { x1: padL, x2: W - padR, y1: base + 0.5, y2: base + 0.5, stroke: "var(--axis)", "stroke-width": 1 });

  const d = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  el("path", { d, fill: "none", stroke: "var(--views)", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });

  el("text", { x: padL, y: base + 36, "font-size": 18, fill: "var(--muted)" }, "What Traffolio keeps: every day since you started");
  el("text", { x: padL, y: 40, "font-size": 16, "font-weight": 600, fill: "var(--text)" }, "Daily views");
</script>
</body>
</html>
