# Traffolio daily collection.
#
# Exit codes of `node dist/cli/collect.js` (see README › Security):
#   0  ok, or template-repo skip (outcome=ok|skipped): nothing failed.
#   1  fatal (outcome=fatal): nothing was written; no commit; job fails.
#   2  partial (outcome=partial): some data was written and IS committed and
#      pushed below, but the collect step stays red so the job still fails.
#
# The commit/push steps use `!cancelled()` so they run even though the collect
# step failed with exit 2. Do NOT add `continue-on-error` to the collect step:
# that would turn exit 2 green.
#
# GitHub Pages (public mode only): the collector prints `pages=true` only in a public
# repository with `public_mode: true` and `pages: true`, on a run that wasn't fatal. The job
# then builds the dashboard from the data it just pushed and uploads it, and the
# `deploy-pages` job publishes it. A partial run (exit 2) deploys too, since its committed
# data is already public; a failed commit or push deploys nothing. This is a job here, not a
# push-triggered workflow, because pushes made with GITHUB_TOKEN start no other workflow.
#
# `pull_request_target` is intentionally absent: this workflow holds a
# write-scoped token and a traffic-scoped PAT, and must never run on
# untrusted pull request code.
name: Traffolio Collect

on:
  schedule:
    # UTC, deliberately off the congested top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffolio-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_artifact: ${{ steps.pages-upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Collect traffic
        id: collect
        run: node dist/cli/collect.js
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        id: commit
        if: ${{ !cancelled() && steps.collect.outputs.commit == 'true' }}
        env:
          DATA_THROUGH: ${{ steps.collect.outputs.data_through }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data README.md
          if [ -d assets ]; then git add -A -- assets; fi
          if [ -d repos ]; then git add -A -- repos; fi
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
            exit 0
          fi
          git commit -m "chore(data): update traffic through ${DATA_THROUGH} (UTC)"

      - name: Push
        id: push
        if: ${{ !cancelled() && steps.collect.outputs.commit == 'true' }}
        run: |
          if git push; then
            exit 0
          fi
          echo "Push failed; rebasing and retrying once."
          if git pull --rebase && git push; then
            exit 0
          fi
          echo "::error::git push failed twice. Check branch protection rules (the default branch must allow github-actions[bot] to push) and concurrent pushes. See README > Troubleshooting."
          exit 1

      # Outside the repository, so nothing generated can be committed.
      - name: Build the public dashboard
        id: pages-build
        if: ${{ !cancelled() && steps.collect.outputs.pages == 'true' && steps.commit.outcome != 'failure' && steps.push.outcome != 'failure' }}
        run: node dist/cli/dashboard.js --public --out "$RUNNER_TEMP/pages/index.html"

      - name: Upload the public dashboard
        id: pages-upload
        if: ${{ !cancelled() && steps.pages-build.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy-pages:
    needs: collect
    # Not success(): the collect job is red on a partial run (exit 2), which still deploys.
    if: ${{ !cancelled() && needs.collect.outputs.pages_artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails until Settings > Pages > Source is "GitHub Actions" (README > Public mode).
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
